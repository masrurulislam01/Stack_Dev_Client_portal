name: Supabase Keep-Alive

on:
  schedule:
    # Run at 00:00 UTC every 3 days to prevent free-tier inactivity pausing
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret." >&2
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}"
          HTTP_STATUS=$(curl --silent --show-error --fail-with-body \
            --output /dev/null --write-out "%{http_code}" \
            "${BASE_URL}/rest/v1/clients?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json")

          echo "Supabase keep-alive read succeeded with HTTP ${HTTP_STATUS}."
